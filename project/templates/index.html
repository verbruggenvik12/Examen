<!doctype html>
<html lang="nl">
<!-- Pagina om een nieuwe prestatie toe te voegen -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nieuwe prestatie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">

<h1>Nieuwe prestatie</h1>

<!-- Formulier voor het toevoegen van een nieuwe prestatie -->
<form method="post" action="/add" class="form-card">
    <input name="name" placeholder="Naam"><br><br>

    <select id="discipline" name="discipline">
        {% for d in disciplines %}
        <option value="{{ d }}">{{ d }}</option>
        {% endfor %}
    </select><br><br>

    <div id="wind-fields" style="display:none;">
        <label for="wind_speed">Windmeting (m/s) <span class="example">(vb: 3,2)</span></label><br>
        <input id="wind_speed" name="wind_speed" placeholder="Windmeting"><br><br>

        <label for="wind_direction">Windrichting</label><br>
        <select id="wind_direction" name="wind_direction">
            <option value="meewind">Meewind</option>
            <option value="tegenwind">Tegenwind</option>
        </select><br><br>
    </div>

    <input name="result" placeholder="Resultaat"><br><br>
    <input type="date" name="date" placeholder="Datum"><br><br>

    <button>Opslaan</button>
</form>

</br>
<nav class="main-menu">
    <ul>
        <li><a href="/performances">Bekijk prestaties</a></li>
        <li><a href="/pr">Bekijk PR</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>
</nav>

</div>
<script>
    const disciplineSelect = document.getElementById('discipline');
    const windFields = document.getElementById('wind-fields');

    const windInput = document.getElementById('wind_speed');
    const windLabel = document.querySelector('label[for="wind_speed"]');

    function toggleWindFields() {
        const value = disciplineSelect.value;
        if (value === '100m' || value === '200m') {
            windFields.style.display = 'block';
        } else {
            windFields.style.display = 'none';
            windInput.value = '';
            document.getElementById('wind_direction').value = 'meewind';
            updateWindWarning();
        }
    }

function updateWindWarning() {
    // 1. Haal de windwaarde op en zet komma's om naar punten
    const rawValue = windInput.value.replace(',', '.').trim();
    const windSpeed = parseFloat(rawValue);
    
    // 2. Haal de windrichting op en zet deze direct om naar KLEINE LETTERS (.toLowerCase())
    const windDirection = windDirectionSelect.value.toLowerCase();

    // 3. Logica: Alleen rood ALS het exact 'meewind' is EN de snelheid >= 2.0
    const isWarning = (windDirection === 'meewind') && (!isNaN(windSpeed) && windSpeed >= 2.0);

    if (isWarning) {
        windLabel.classList.add('warning-text');
        windInput.classList.add('warning-input');
    } else {
        windLabel.classList.remove('warning-text');
        windInput.classList.remove('warning-input');
    }
}

    disciplineSelect.addEventListener('change', toggleWindFields);
    windInput.addEventListener('input', updateWindWarning);
    toggleWindFields();
    updateWindWarning();
</script>
</body>
</html>
